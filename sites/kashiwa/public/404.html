<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0284c7">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>ページが見つかりません | 柏たなかマップログ</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #5f6b7a;
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-soft: #e0f2fe;
      --teal: #14b8a6;
      --line: #e2e8f0;
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--ink);
      background: #fff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #f8fafc 0%, #fff 46%, #f0f9ff 100%);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible { outline: 3px solid #38bdf8; outline-offset: 3px; }

    .site-header {
      min-height: 68px;
      padding: 0 max(24px, calc((100% - 1080px) / 2));
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid rgba(226, 232, 240, .8);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--primary-dark);
      font-weight: 800;
      font-size: 1.05rem;
      text-decoration: none;
    }

    .brand img { width: 40px; height: 40px; object-fit: contain; }

    main {
      flex: 1;
      position: relative;
      display: grid;
      place-items: center;
      padding: 56px 20px 150px;
      overflow: hidden;
    }

    .station-sign {
      position: relative;
      z-index: 2;
      width: min(100%, 680px);
      margin-top: 40px;
      border: 1px solid #bae6fd;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 20px 55px rgba(15, 23, 42, .11);
      text-align: center;
    }

    .sign-main { padding: 58px clamp(24px, 6vw, 56px) 4px; }

    .station-number {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      border: 6px solid var(--primary-dark);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 8px 20px rgba(2, 132, 199, .2);
      color: var(--primary-dark);
      transform: translate(-50%, -50%);
      font-size: 1.45rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.04em;
      line-height: 1;
    }

    h1 {
      margin: 0;
      color: #0f172a;
      font-size: clamp(1.7rem, 5.4vw, 2.5rem);
      line-height: 1.3;
      letter-spacing: .04em;
    }

    .romaji {
      margin: 6px 0 0;
      color: #64748b;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .24em;
    }

    .route-bar {
      position: relative;
      height: 14px;
      border-radius: 17px 17px 0 0;
      background: linear-gradient(90deg, var(--primary), var(--teal));
    }

    .sign-body { padding: 28px clamp(24px, 6vw, 56px) 36px; }

    .description {
      max-width: 32rem;
      margin: 0 auto;
      color: var(--muted);
      font-size: .98rem;
      line-height: 1.9;
    }

    .actions {
      margin-top: 26px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      min-height: 50px;
      padding: 11px 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 9px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .button:hover { transform: translateY(-2px); }

    .button-primary {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 8px 20px rgba(2, 132, 199, .22);
    }

    .button-primary:hover { background: var(--primary-dark); }

    .railway {
      position: absolute;
      right: 0;
      bottom: 40px;
      left: 0;
      z-index: 1;
      height: 86px;
      overflow: hidden;
      pointer-events: none;
    }

    .track { position: absolute; right: 0; bottom: 0; left: 0; height: 32px; }
    .rails { position: absolute; inset: 0; border-top: 5px solid #475569; border-bottom: 5px solid #475569; }
    .ties { position: absolute; top: 3px; right: 0; bottom: 3px; left: 0; background: repeating-linear-gradient(90deg, #94a3b8 0 16px, transparent 16px 44px); }

    .train {
      position: absolute;
      bottom: 8px;
      left: -240px;
      filter: drop-shadow(0 10px 18px rgba(2, 132, 199, .3));
      animation: train-arrive 2.4s cubic-bezier(.22, 1, .36, 1) .4s forwards;
    }

    @keyframes train-arrive {
      to { left: 50%; transform: translateX(-50%); }
    }

    footer {
      padding: 24px;
      border-top: 1px solid var(--line);
      color: #64748b;
      background: #f8fafc;
      text-align: center;
      font-size: .78rem;
    }

    @media (max-width: 640px) {
      .site-header { min-height: 62px; padding: 0 16px; }
      main { padding: 40px 16px 120px; }
      .station-sign { margin-top: 34px; }
      .station-number { width: 68px; height: 68px; border-width: 5px; font-size: 1.2rem; }
      .sign-main { padding-top: 48px; }
      .railway { bottom: 24px; height: 64px; }
      .train svg { width: 150px; height: 58px; }
      .actions .button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .train { left: 50%; transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="柏たなかマップログ トップ">
      <img src="/header-icon.png" width="40" height="40" alt="">
      <span>柏たなかマップログ</span>
    </a>
  </header>

  <main>
    <section class="station-sign" aria-labelledby="page-title">
      <div class="route-bar" aria-hidden="true"><span class="station-number">404</span></div>
      <div class="sign-main">
        <h1 id="page-title">ページが見つかりません</h1>
        <p class="romaji" aria-hidden="true">PAGE NOT FOUND</p>
      </div>
      <div class="sign-body">
        <p class="description">
          お探しのページは存在しないか、公開を終了した可能性があります。<br>
          URLをご確認いただくか、トップページから目的のマップをお探しください。
        </p>
        <div class="actions">
          <a class="button button-primary" href="/">トップページへ戻る <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </section>

    <div class="railway" aria-hidden="true">
      <div class="track"><div class="ties"></div><div class="rails"></div></div>
      <div class="train">
        <svg viewBox="0 0 200 70" width="200" height="78" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="14" width="180" height="38" rx="8" fill="#0284c7"/>
          <rect x="10" y="32" width="180" height="6" fill="#14b8a6"/>
          <rect x="18" y="20" width="44" height="12" rx="2" fill="#172033"/>
          <text x="40" y="29.5" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, sans-serif">回送</text>
          <rect x="70" y="22" width="26" height="16" rx="3" fill="#e0f2fe"/>
          <rect x="102" y="22" width="26" height="16" rx="3" fill="#e0f2fe"/>
          <rect x="134" y="22" width="26" height="16" rx="3" fill="#e0f2fe"/>
          <rect x="176" y="20" width="14" height="20" rx="3" fill="#0369a1"/>
          <circle cx="36" cy="56" r="7" fill="#334155"/>
          <circle cx="76" cy="56" r="7" fill="#334155"/>
          <circle cx="124" cy="56" r="7" fill="#334155"/>
          <circle cx="164" cy="56" r="7" fill="#334155"/>
          <circle cx="36" cy="56" r="3" fill="#94a3b8"/>
          <circle cx="76" cy="56" r="3" fill="#94a3b8"/>
          <circle cx="124" cy="56" r="3" fill="#94a3b8"/>
          <circle cx="164" cy="56" r="3" fill="#94a3b8"/>
        </svg>
      </div>
    </div>
  </main>

  <footer>© 2026 柏たなかマップログ</footer>
</body>
</html>
