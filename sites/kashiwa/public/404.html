<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f8faf7">
  <link rel="icon" href="/favicon.png">
  <title>ページが見つかりません | 柏たなかマップログ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      color: #26332b;
      background: #f8faf7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 15% 18%, rgb(134 239 172 / 18%), transparent 28rem),
        radial-gradient(circle at 88% 82%, rgb(125 211 252 / 16%), transparent 30rem),
        #f8faf7;
    }

    main {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 32px 20px;
    }

    .card {
      width: min(100%, 680px);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid #dfe8e1;
      border-radius: 24px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 24px 70px rgb(38 51 43 / 10%);
      text-align: center;
    }

    .status {
      margin: 0 0 12px;
      color: #22a15c;
      font-size: clamp(4.5rem, 18vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: 0.9;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      letter-spacing: 0.02em;
    }

    .description {
      max-width: 32rem;
      margin: 24px auto 0;
      color: #59665e;
      font-size: 1rem;
      line-height: 1.9;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 32px;
      padding: 0 24px;
      border-radius: 999px;
      color: #fff;
      background: #238a50;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .home-link:hover {
      background: #176c3c;
      transform: translateY(-1px);
    }

    .home-link:focus-visible {
      outline: 3px solid #86efac;
      outline-offset: 4px;
    }

    .site-name {
      margin: 36px 0 0;
      color: #7a877f;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <p class="status" aria-hidden="true">404</p>
      <h1 id="page-title">ページが見つかりません</h1>
      <p class="description">
        指定されたページは存在しないか、公開を終了した可能性があります。<br>
        URLをご確認いただくか、トップページから目的のマップをお探しください。
      </p>
      <a class="home-link" href="/">トップページへ戻る</a>
      <p class="site-name">柏たなかマップログ</p>
    </section>
  </main>
</body>
</html>
