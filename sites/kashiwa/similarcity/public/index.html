<style>
:root {
  --bg: #0b0e13; --panel: rgba(16, 19, 26, .86); --panel-solid: #12161e; --line: rgba(255, 255, 255, .09);
  --line2: rgba(255, 255, 255, .16); --tx: #e9ecf2; --mut: #8d96a8; --dim: #5d6576; --acc: #f1f3f7;
  --a: #ff7a59; --b: #5aa9ff; --ok: #4fd1a5; --warn: #f3b74f; --bad: #ff6b6b;
  --r: 14px; --sheet-h: 64px;
  --sans: "Inter", "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font: 13px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: #9cc7ff; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
#map { position: fixed; inset: 0; }
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); box-shadow: 0 10px 40px rgba(0, 0, 0, .45); }
.eyebrow { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--mut); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line2); font-size: 11.5px; color: var(--tx); white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(255, 255, 255, .25) inset; }
.btn { padding: 6px 11px; border-radius: 9px; border: 1px solid var(--line2); font-size: 12px; color: var(--tx); transition: background .15s, border-color .15s; }
.btn:hover { background: rgba(255, 255, 255, .07); border-color: rgba(255, 255, 255, .3); }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--mut); }
.icon-btn:hover { background: rgba(255, 255, 255, .07); color: var(--tx); }

/* ---- 左上インフォパネル ---- */
#about { position: fixed; top: 14px; left: 14px; width: 340px; padding: 16px 18px 14px; z-index: 8; }
#about h1 { font-size: 17px; margin: 4px 0 6px; font-weight: 700; letter-spacing: .01em; }
#about p { margin: 0 0 10px; color: var(--mut); font-size: 12.5px; }
#about .row { display: flex; gap: 6px; flex-wrap: wrap; }
#about .toggle { position: absolute; top: 10px; right: 10px; }
#about:not(.min) { max-height: calc(100vh - 110px); overflow-y: auto; }
#about.min { width: auto; padding: 10px 46px 10px 14px; }
#about.min .body { display: none; }
#about.min h1 { font-size: 14px; margin: 0; }
#about.min .eyebrow { display: none; }
.legend { margin: 4px 0 12px; }
.legend .ramp { height: 8px; border-radius: 5px; background: linear-gradient(90deg, #c0533a, #c27a6e, #9b8fa6, #5e93c0, #2f8fb8); }
.legend .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--mut); margin-top: 4px; }
.legend .hint { font-size: 11.5px; color: var(--tx); margin-bottom: 6px; }
.modeseg { display: flex; gap: 2px; padding: 2px; margin: 0 0 10px; border: 1px solid var(--line2); border-radius: 10px; }
.modeseg button { flex: 1; padding: 5px 6px; border-radius: 8px; font-size: 12px; color: var(--mut); }
.modeseg button[aria-pressed="true"] { background: rgba(255, 255, 255, .1); color: var(--tx); }
.tylist { max-height: 34vh; overflow: auto; margin: 0 -6px; padding: 0 6px; }
.tylist .gh { font-size: 10.5px; color: var(--mut); margin: 8px 0 2px; display: flex; gap: 6px; align-items: center; }
.ty { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 4px 6px; border-radius: 7px; font-size: 12px; line-height: 1.35; color: var(--tx); }
.ty:hover { background: rgba(255, 255, 255, .06); }
.ty[aria-pressed="true"] { background: rgba(255, 255, 255, .12); }
.ty .n { margin-left: auto; color: var(--dim); font-size: 11px; }
.tyfocus { margin: 8px 0 0; padding: 8px 10px; border-left: 3px solid var(--line2); border-radius: 8px; background: rgba(255, 255, 255, .03); font-size: 12px; line-height: 1.65; }
.tyfocus small { display: block; color: var(--mut); font-size: 11px; margin-top: 4px; }

/* ---- 右上検索 ---- */
#searchbox { position: fixed; top: 14px; right: 14px; width: 320px; z-index: 9; }
#searchbox .field { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; height: 44px; }
#searchbox input { flex: 1; background: none; border: 0; outline: 0; color: var(--tx); font: 14px var(--sans); min-width: 0; }
#searchbox input::placeholder { color: var(--dim); }
kbd { font: 11px var(--sans); color: var(--mut); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
#sugg { margin-top: 6px; padding: 6px; display: none; max-height: 50vh; overflow: auto; }
#sugg.open { display: block; }
#sugg button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-align: left; }
#sugg button[aria-selected="true"], #sugg button:hover { background: rgba(255, 255, 255, .08); }
#sugg .pref { color: var(--mut); font-size: 11.5px; margin-left: auto; }
#sugg .empty { padding: 8px 10px; color: var(--mut); }
.maplibregl-ctrl-top-right { top: 66px; }
.maplibregl-ctrl-group { background: var(--panel-solid) !important; border: 1px solid var(--line); }
.maplibregl-ctrl-group button { filter: invert(.9); }
.maplibregl-ctrl-group button + button { border-top-color: rgba(0, 0, 0, .2) !important; }
.maplibregl-ctrl-attrib { background: rgba(11, 14, 19, .7) !important; color: var(--mut); font: 10px/1.4 var(--sans); }
.maplibregl-ctrl-attrib a { color: var(--mut); }
.maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { bottom: calc(var(--sheet-h) + 18px); transition: bottom .3s; }

#tip { position: fixed; z-index: 4; pointer-events: none; padding: 6px 10px; display: none; flex-direction: column; gap: 2px; max-width: 320px; font-size: 12px; border-radius: 9px; }
.mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--sans); color: #0b0e13; background: #f1f3f7; box-shadow: 0 0 0 2px rgba(11, 14, 19, .85), 0 4px 12px rgba(0, 0, 0, .5); cursor: pointer; transition: transform .15s; }
.mk:hover, .mk.on { transform: scale(1.25); background: #fff; }
.mk.self { width: 14px; height: 14px; background: #fff; box-shadow: 0 0 0 3px rgba(11, 14, 19, .9), 0 0 0 6px rgba(255, 255, 255, .35); }

/* ---- 下部シート ---- */
#sheet { position: fixed; left: 14px; right: 14px; bottom: 14px; z-index: 7; height: var(--sheet-h); display: flex; flex-direction: column; transition: height .3s cubic-bezier(.2, .8, .2, 1); overflow: hidden; }
#sheet .grab { flex: none; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 18px; height: 62px; cursor: pointer; user-select: none; }
#sheet .handle { position: absolute; top: 6px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 3px; background: var(--line2); }
#sheet .ttl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
#sheet .ttl .big { width: 30px; height: 30px; border-radius: 9px; flex: none; box-shadow: 0 0 0 1px rgba(255, 255, 255, .2) inset; }
#sheet .ttl h2 { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sheet .ttl .sub { color: var(--mut); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sheet .chev { transition: transform .3s; }
#sheet[data-state="full"] .chev, #sheet[data-state="half"] .chev { transform: rotate(180deg); }
#sheet .content { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; border-top: 1px solid var(--line); }
#sheet .col { min-height: 0; overflow: auto; padding: 14px 18px 18px; }
#sheet .col + .col { border-left: 1px solid var(--line); }
.examples { display: flex; gap: 6px; flex-wrap: wrap; }
.examples button { padding: 4px 10px; border: 1px solid var(--line2); border-radius: 999px; font-size: 12px; }
.examples button:hover { background: rgba(255, 255, 255, .07); }

.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 10px; }
.sec-h h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); }
.sec-h small { color: var(--dim); font-size: 11px; }
.traits { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.traits .chip b { font-weight: 600; }
.up { color: #ffb199; } .dn { color: #8cc4ff; }

.cards { display: flex; flex-direction: column; gap: 6px; }
.card { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 10px 9px 8px; border-radius: 11px; border: 1px solid transparent; cursor: pointer; text-align: left; width: 100%; transition: background .15s, border-color .15s; }
.card:hover { background: rgba(255, 255, 255, .045); }
.card.on { background: rgba(255, 255, 255, .07); border-color: var(--line2); }
.card .rk { font: 600 15px var(--sans); color: var(--dim); text-align: center; }
.card.on .rk { color: var(--tx); }
.card .nm { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; font-size: 13.5px; }
.card .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 0 10px; min-width: 0; color: var(--mut); font-size: 11px; }
.card .meta span { white-space: nowrap; }
.card .meter { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.card .meter i { display: block; height: 100%; border-radius: 2px; }
.card .go { grid-row: 1 / 3; grid-column: 3; opacity: 0; }
.card:hover .go, .card.on .go { opacity: 1; }
.stab { display: inline-flex; align-items: center; gap: 6px; }
.note { color: var(--mut); font-size: 11.5px; line-height: 1.6; }
.lead { margin: 0 0 14px; font-size: 13px; line-height: 1.75; color: var(--tx); }
.prose { margin: 0 0 14px; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--line2); border-radius: 10px; background: rgba(255,255,255,.025); }
.prose p { margin: 0; font-size: 13px; line-height: 1.8; }
.prose .pn { margin-top: 6px; font-size: 11px; line-height: 1.5; color: var(--mut); }

.vs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.vs .who { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.vs .x { color: var(--dim); }
.vs .sw { width: 14px; height: 14px; border-radius: 4px; }
.cmpgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; margin-bottom: 18px; }
.box h4 { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; color: var(--mut); letter-spacing: .05em; }
.dom { display: grid; grid-template-columns: 92px 1fr 38px; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 5px; }
.dom .tr { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .06); overflow: hidden; }
.dom .tr i { display: block; height: 100%; border-radius: 3px; }
.dom .v { text-align: right; color: var(--mut); font-size: 11.5px; }
.li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.li:last-child { border-bottom: 0; }
.li .r { color: var(--mut); white-space: nowrap; font-size: 12px; }
.badge { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; margin-left: 6px; }
.badge.c { background: rgba(79, 209, 165, .14); color: var(--ok); }
.badge.d { background: rgba(243, 183, 79, .14); color: var(--warn); }

.prof { width: 100%; border-collapse: collapse; }
.prof td { padding: 3px 0; font-size: 12px; vertical-align: middle; }
.prof .g td { padding: 12px 0 4px; font-size: 11px; color: var(--mut); letter-spacing: .08em; font-weight: 600; }
.prof .lb { width: 36%; padding-right: 10px; }
.prof .vals { width: 24%; text-align: right; color: var(--mut); white-space: nowrap; padding-left: 10px; }
.db { position: relative; height: 16px; }
.db .ax { position: absolute; left: 0; right: 0; top: 7.5px; height: 1px; background: rgba(255, 255, 255, .07); }
.db .c0 { position: absolute; left: 50%; top: 2px; height: 12px; width: 1px; background: rgba(255, 255, 255, .25); }
.db .seg { position: absolute; top: 6.5px; height: 3px; background: rgba(255, 255, 255, .22); border-radius: 2px; }
.db .p { position: absolute; top: 3px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; border: 2px solid var(--bg); }
.legendrow { display: flex; gap: 14px; align-items: center; font-size: 11.5px; color: var(--mut); margin: 4px 0 4px; flex-wrap: wrap; }
.legendrow span { display: inline-flex; gap: 6px; align-items: center; }

/* ---- ダイアログ ---- */
dialog { border: 1px solid var(--line2); border-radius: 18px; padding: 0; background: var(--panel-solid); color: var(--tx); width: min(860px, calc(100vw - 28px)); max-height: min(86vh, 900px); box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
dialog::backdrop { background: rgba(5, 7, 10, .6); backdrop-filter: blur(3px); }
dialog[open] { display: flex; flex-direction: column; }
.dlg-h { display: flex; align-items: center; gap: 4px; padding: 12px 12px 0 20px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; flex: 1; overflow-x: auto; }
.tabs button { padding: 10px 14px 12px; color: var(--mut); border-bottom: 2px solid transparent; font-weight: 600; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--tx); border-bottom-color: var(--tx); }
.dlg-b { overflow: auto; padding: 18px 24px 26px; }
.dlg-b section { display: none; }
.dlg-b section.on { display: block; }
.dlg-b h3 { font-size: 15px; margin: 18px 0 8px; }
.dlg-b h3:first-child { margin-top: 0; }
.dlg-b p, .dlg-b li { color: #c9cfdb; font-size: 13px; }
.dlg-b ol, .dlg-b ul { padding-left: 20px; }
.steps { counter-reset: s; list-style: none; padding: 0 !important; display: grid; gap: 8px; }
.steps li { counter-increment: s; position: relative; padding: 10px 12px 10px 44px; border: 1px solid var(--line); border-radius: 11px; }
.steps li::before { content: counter(s); position: absolute; left: 12px; top: 10px; width: 22px; height: 22px; border-radius: 50%; background: rgba(255, 255, 255, .08); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--tx); }
.steps b { color: var(--tx); }
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 6px 0 10px; }
.tw .tbl { margin: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0 10px; }
.tbl th, .tbl td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.tbl th { color: var(--mut); font-weight: 600; font-size: 11.5px; }
.tbl td.n { text-align: right; }
.hbar { display: flex; align-items: center; gap: 8px; }
.hbar .tr { flex: 1; height: 6px; background: rgba(255, 255, 255, .06); border-radius: 3px; overflow: hidden; min-width: 60px; }
.hbar .tr i { display: block; height: 100%; background: linear-gradient(90deg, #5aa9ff, #4fd1a5); }
.indgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.indgrid .box { border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
.indgrid .box ul { margin: 0; padding-left: 16px; }
.indgrid .box li { font-size: 12px; color: #c9cfdb; }
.callout { border: 1px solid rgba(243, 183, 79, .3); background: rgba(243, 183, 79, .06); border-radius: 11px; padding: 10px 14px; margin: 10px 0; }
.callout p { margin: 4px 0; }

/* ---- タッチ端末: 16px 未満の入力欄は iOS がフォーカス時に拡大する ---- */
@media (pointer: coarse) { #searchbox input { font-size: 16px; } }
@media (max-width: 760px) { .tylist { max-height: 22vh; } }

/* ---- 狭い画面 ---- */
@media (max-width: 760px) {
  #about { left: 10px; right: 10px; top: 10px; width: auto; padding: 12px 14px; }
  #about:not(.min) { max-height: 70vh; overflow: auto; }
  #searchbox { top: auto; left: 10px; right: 10px; width: auto; position: fixed; }
  #sheet { left: 0; right: 0; bottom: 0; border-radius: 18px 18px 0 0; border-bottom: 0; }
  #sheet .content { display: block; overflow: auto; }
  #sheet .col { overflow: visible; }
  #sheet .col + .col { border-left: 0; border-top: 1px solid var(--line); }
  .cmpgrid { grid-template-columns: 1fr; }
  .maplibregl-ctrl-top-right { display: none; }
  .prof .lb { width: 42%; }
  #sheet .grab { padding-left: 14px; gap: 8px; }
  #sheet .ttl { gap: 10px; }
  #sheet .ttl h2 { font-size: 16px; line-height: 1.3; }
  #sheet .ttl .sub { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 11.5px; line-height: 1.35; }
  .tbl { font-size: 11.5px; }
  .tbl th, .tbl td { padding: 6px 6px; }
}
</style>
</head>
<body>
<div id="map" aria-label="市区町村の色分け地図"></div>
<div id="tip" class="glass"></div>

<aside id="about" class="glass">
  <div class="eyebrow">Similarcity · Japan</div>
  <h1>市区町村 統計類似色マップ</h1>

    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l4-4 4 4"/></svg>
  </button>
  <div class="body">
    <p>全国 <b class="num" id="nArea">1,890</b> の市区町村・区を <b class="num" id="nInd">49</b> の統計指標で比べ、<b style="color:var(--tx)">統計的に似ている地域ほど近い色</b>で塗っています。</p>
    <div class="modeseg" role="group" aria-label="色分け">

      <button data-mode="minor" aria-pressed="false">小分類</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="row">
      <button class="btn" data-open="method">手法</button>
      <button class="btn" data-open="sens">感度分析</button>
      <button class="btn" data-open="src">出典・注意</button>
      <a class="btn" href="stations.html" style="text-decoration:none">駅圏版へ</a>
    </div>
    <p class="note" style="margin-top:12px"><a href="https://github.com/sanskruthiya/municipal-similarity-map" target="_blank" rel="noopener">GitHub</a> ／ <a href="/">柏たなかマップログ トップ</a></p>
  </div>
</aside>

<div id="searchbox">
  <div class="field glass">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8d96a8" stroke-width="1.7"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
    <input id="q" type="search" placeholder="市区町村名で検索" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
    <kbd id="kbd">/</kbd>
  </div>
  <div id="sugg" class="glass" role="listbox"></div>
</div>

<section id="sheet" class="glass" data-state="peek" aria-label="選択した地域の詳細">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="詳細パネルを開閉">
    <div class="handle"></div>
    <div class="ttl" id="ttl"></div>
    <button class="icon-btn chev" aria-hidden="true" tabindex="-1">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l4-4 4 4"/></svg>
    </button>
  </div>
  <div class="content">
    <div class="col" id="left"></div>
    <div class="col" id="right"></div>
  </div>
</section>

<dialog id="dlg">
  <div class="dlg-h">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="method">手法</button>
      <button role="tab" data-tab="sens">感度分析</button>
      <button role="tab" data-tab="src">出典・注意</button>
    </div>

      <svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.6"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <div class="dlg-b">
    <section data-sec="method" id="secMethod"></section>
    <section data-sec="sens" id="secSens"></section>
    <section data-sec="src" id="secSrc"></section>
  </div>
</dialog>

<script>
const REPO = "https://github.com/sanskruthiya/municipal-similarity-map";
const EXCL = "#3a3f4a";
const GROUP_COLORS = ["#6ea8ff", "#ff9f6e", "#7bd88f", "#ff7a8a", "#c79bff", "#5fd4d0", "#f2cf5b"];
const LABEL_MINZOOM = 7;  // これより拡大したときだけ市区町村名を表示
const EXAMPLES = ["柏市", "渋谷区", "軽井沢町", "札幌市中央区", "那覇市", "与那国町"];

let A, IND, W, GROUPS, SENS, TY = null, MODE = "sim", tyFocus = null, map, byCode = {}, CENT = {}, BOUNDS = {}, D_REF = 3, selected = null, cmp = null, markers = [];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const label = a => a.name.startsWith(a.pref) ? a.name : `${a.pref} ${a.name}`;
const simColor = a => a.excluded ? EXCL : a.colors.umap_oklab;
const tyOf = a => TY && TY.areas[a.code];
const majorOf = a => tyOf(a) ? TY.major[tyOf(a)[0]] : null;
const minorOf = a => tyOf(a) ? TY.minor[tyOf(a)[1]] : null;
const colorBy = (a, m) => a.excluded || (m !== "sim" && !tyOf(a)) ? EXCL : m === "major" ? majorOf(a).color : m === "minor" ? minorOf(a).color : a.colors.umap_oklab;
const color = a => colorBy(a, MODE);
const pct = (v, d = 0) => (v * 100).toFixed(d) + "%";
function fmt(v) {
  if (v === null || v === undefined) return "–";
  const x = Math.abs(v);
  return x >= 1000 ? Math.round(v).toLocaleString() : x >= 10 ? v.toFixed(1) : x >= 1 ? v.toFixed(2) : v.toFixed(3);
}
function km(p, q) {
  const r = Math.PI / 180, dl = (q[1] - p[1]) * r, dg = (q[0] - p[0]) * r;
  const h = Math.sin(dl / 2) ** 2 + Math.cos(p[1] * r) * Math.cos(q[1] * r) * Math.sin(dg / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
// 最大面積のポリゴンの重心（マーカー位置）と全体の範囲
function geomInfo(g) {
  const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
  const b = new maplibregl.LngLatBounds();
  let best = null, bestA = -1;
  for (const p of polys) {
    const ring = p[0]; let a = 0, cx = 0, cy = 0;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const f = ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
      a += f; cx += (ring[j][0] + ring[i][0]) * f; cy += (ring[j][1] + ring[i][1]) * f;
      b.extend(ring[i]);
    }
    if (Math.abs(a) > bestA) { bestA = Math.abs(a); best = a ? [cx / (3 * a), cy / (3 * a)] : ring[0]; }
  }
  return { b, c: best };
}

Promise.all([
  fetch("data/muni.topojson").then(r => r.json()),
  fetch("data/attributes.json").then(r => r.json()),
  fetch("data/sensitivity.json").then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("data/labels.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetch("data/typology.json").then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([topo, attrs, sens, lp, ty]) => {
  A = attrs; IND = A.meta.indicators; SENS = sens; TY = ty;
  if (!TY) document.querySelector(".modeseg").style.display = "none";
  GROUPS = [...new Set(IND.map(d => d.group))];
  const gn = {}; IND.forEach(d => gn[d.group] = (gn[d.group] || 0) + 1);
  W = IND.map(d => 1 / gn[d.group]);  // 距離計算での重み²（分野ごとに 1/√指標数 の二乗）
  A.areas.forEach(a => byCode[a.code] = a);
  const ds = A.areas.filter(a => a.neighbors).flatMap(a => a.neighbors.map(n => n.d)).sort((x, y) => x - y);
  D_REF = ds[Math.floor(ds.length * .99)];
  $("#nArea").textContent = A.areas.length.toLocaleString();
  $("#nInd").textContent = IND.length;
  const gj = topojson.feature(topo, topo.objects[Object.keys(topo.objects)[0]]);
  gj.features.forEach(f => {
    const a = byCode[f.properties.code];
    if (!a) return;
    const gi = geomInfo(f.geometry);
    BOUNDS[a.code] = gi.b; CENT[a.code] = lp[a.code] || gi.c;
    f.properties.c_sim = colorBy(a, "sim"); f.properties.c_major = colorBy(a, "major"); f.properties.c_minor = colorBy(a, "minor");
  });
  initMap(gj); buildDialogs(); renderLegend(); renderEmpty();
});

function initMap(gj) {
  map = new maplibregl.Map({
    container: "map",
    style: { version: 8, glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf", sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": "#0b0e13" } }] },
    bounds: [[128.6, 30.6], [146.2, 45.6]], fitBoundsOptions: { padding: initPad() }, minZoom: 3.5, maxZoom: 12, attributionControl: false,
    localIdeographFontFamily: "'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Noto Sans CJK JP', 'Yu Gothic', Meiryo, sans-serif", dragRotate: false, pitchWithRotate: false,
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  map.addControl(new maplibregl.AttributionControl({ compact: innerWidth <= 760, customAttribution: "e-Stat・国土数値情報を加工" }), "bottom-right");
  map.on("load", () => {
    map.addSource("muni", { type: "geojson", data: gj, promoteId: "code" });
    map.addSource("links", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({ id: "fill", type: "fill", source: "muni", paint: { "fill-color": ["get", "c_" + MODE], "fill-opacity": 1 } });
    map.addLayer({ id: "edge", type: "line", source: "muni", paint: { "line-color": "#0b0e13", "line-width": ["interpolate", ["linear"], ["zoom"], 4, .15, 9, .8], "line-opacity": .55 } });
    map.addLayer({ id: "links", type: "line", source: "links", layout: { "line-cap": "round" }, paint: { "line-color": "#ffffff", "line-width": 1, "line-opacity": .45, "line-dasharray": [1, 2] } });
    map.addLayer({ id: "hl", type: "line", source: "muni", paint: {
      "line-color": "#ffffff",
      "line-width": ["case", ["boolean", ["feature-state", "sel"], false], 2.6, ["boolean", ["feature-state", "cmp"], false], 2.2, ["boolean", ["feature-state", "nbr"], false], 1.1, 0],
      "line-opacity": ["case", ["boolean", ["feature-state", "nbr"], false], .8, 1] } });
    map.addLayer({ id: "hover", type: "line", source: "muni", paint: { "line-color": "#ffffff", "line-width": ["case", ["boolean", ["feature-state", "hov"], false], 1.4, 0] } });
    map.addSource("labels", { type: "geojson", data: { type: "FeatureCollection", features: A.areas.filter(a => CENT[a.code]).map(a => ({ type: "Feature", properties: { name: a.name, code: a.code }, geometry: { type: "Point", coordinates: CENT[a.code] } })) } });
    map.addLayer({ id: "labels", type: "symbol", source: "labels", minzoom: LABEL_MINZOOM,
      layout: { "text-field": ["get", "name"], "text-font": ["Open Sans Semibold"], "text-size": ["interpolate", ["linear"], ["zoom"], LABEL_MINZOOM, 10, 10, 12.5, 12, 15], "text-max-width": 8, "text-padding": 3 },
      paint: { "text-color": "#eef1f6", "text-halo-color": "rgba(11, 14, 19, .85)", "text-halo-width": 1.3, "text-opacity": ["interpolate", ["linear"], ["zoom"], LABEL_MINZOOM, 0, LABEL_MINZOOM + .4, 1] } });
    // 選択中と Top10 は番号マーカーと重ならないよう、名前をマーカーの上下にずらして優先表示
    map.addLayer({ id: "labels-sel", type: "symbol", source: "labels", minzoom: LABEL_MINZOOM, filter: ["==", ["get", "code"], ""],
      layout: { "text-field": ["get", "name"], "text-font": ["Open Sans Semibold"], "text-size": ["interpolate", ["linear"], ["zoom"], LABEL_MINZOOM, 11, 10, 13.5, 12, 16], "text-max-width": 8,
        "text-variable-anchor": ["top", "bottom", "left", "right"], "text-radial-offset": 1.15, "symbol-sort-key": 0 },
      paint: { "text-color": "#ffffff", "text-halo-color": "rgba(11, 14, 19, .95)", "text-halo-width": 1.6 } });
    const tip = $("#tip");
    let hov = null;
    map.on("mousemove", "fill", e => {
      const a = byCode[e.features[0].properties.code];
      map.getCanvas().style.cursor = "pointer";
      if (hov !== a.code) { if (hov) map.setFeatureState({ source: "muni", id: hov }, { hov: false }); hov = a.code; map.setFeatureState({ source: "muni", id: hov }, { hov: true }); }
      tip.style.display = "flex"; tip.style.left = (e.originalEvent.clientX + 14) + "px"; tip.style.top = (e.originalEvent.clientY + 14) + "px";
      tip.innerHTML = `<span style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${color(a)}"></span>${esc(label(a))}</span>` +
        (MODE !== "sim" && tyOf(a) ? `<span style="color:var(--mut);font-size:11px;margin-left:18px">${esc(MODE === "major" ? majorOf(a).name : minorOf(a).name)}</span>` : "");
    });
    map.on("mouseleave", "fill", () => { tip.style.display = "none"; map.getCanvas().style.cursor = ""; if (hov) map.setFeatureState({ source: "muni", id: hov }, { hov: false }); hov = null; });
    map.on("click", "fill", e => select(e.features[0].properties.code, { fly: false }));
    window.__mapReady = true;
    const h = decodeURIComponent(location.hash.slice(1));
    if (byCode[h]) select(h, { push: false });
  });
}

function setStates(code, on) {
  const a = byCode[code];
  map.setFeatureState({ source: "muni", id: code }, { sel: on });
  (a.neighbors || []).forEach(n => map.setFeatureState({ source: "muni", id: n.code }, { nbr: on }));
}
function setCmpState(code, on) { if (code) map.setFeatureState({ source: "muni", id: code }, { cmp: on }); }

function select(code, { fly = true, push = true } = {}) {
  const a = byCode[code];
  if (!a) return;
  if (selected) { setStates(selected, false); setCmpState(cmp, false); }
  selected = code; setStates(code, true);
  cmp = a.neighbors ? a.neighbors[0].code : null; setCmpState(cmp, true);
  const keep = [code, ...(a.neighbors || []).map(n => n.code)];
  tyFocus = null; renderLegend(); applyOpacity();
  if (innerWidth <= 760 && !$("#about").classList.contains("min")) { $("#aboutToggle").click(); layoutSearch(); }
  setLabelFocus(keep);
  map.getSource("links").setData({ type: "FeatureCollection", features: (a.neighbors || []).filter(n => CENT[n.code]).map(n => ({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: [CENT[code], CENT[n.code]] } })) });
  drawMarkers(a);
  if ($("#sheet").dataset.state === "peek") setSheet("half");
  if (fly && BOUNDS[code]) map.fitBounds(BOUNDS[code], { padding: pad(), maxZoom: 9, duration: 700 });
  if (push && location.hash.slice(1) !== code) history.replaceState(null, "", "#" + code);
  document.title = `${label(a)} に似ている市区町村 | 市区町村 統計類似色マップ`;
  renderSelected();
}
function applyOpacity() {
  if (selected) {
    const a = byCode[selected], keep = [selected, ...(a.neighbors || []).map(n => n.code)];
    map.setPaintProperty("fill", "fill-opacity", ["case", ["in", ["get", "code"], ["literal", keep]], 1, .28]);
  } else if (tyFocus) {
    const [lv, id] = tyFocus, codes = Object.keys(TY.areas).filter(c => TY.areas[c][lv === "major" ? 0 : 1] === id);
    map.setPaintProperty("fill", "fill-opacity", ["case", ["in", ["get", "code"], ["literal", codes]], 1, .12]);
  } else map.setPaintProperty("fill", "fill-opacity", 1);
}
function setMode(m) {
  MODE = m;
  document.querySelectorAll(".modeseg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  if (tyFocus && (m === "sim" || tyFocus[0] !== m)) tyFocus = null;
  if (map && map.getLayer("fill")) { map.setPaintProperty("fill", "fill-color", ["get", "c_" + m]); applyOpacity(); }
  renderLegend();
  selected ? (drawMarkers(byCode[selected]), renderSelected()) : renderEmpty();
}
document.querySelectorAll(".modeseg button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
function tyMembers(lv, id) { return A.areas.filter(a => tyOf(a) && tyOf(a)[lv === "major" ? 0 : 1] === id); }
// 類型の説明: 構成する市区町村の中央値（標準化値）で目立つ指標と、中央値に近い代表例
function describeType(lv, id) {
  const ms = tyMembers(lv, id);
  const med = IND.map((d, i) => { const v = ms.map(a => a.z[i]).sort((x, y) => x - y), h = v.length >> 1; return v.length % 2 ? v[h] : (v[h - 1] + v[h]) / 2; });
  const top = salient({ z: med }, 4, .5);
  const ex = ms.map(a => ({ a, d: IND.reduce((s, d, i) => s + W[i] * (a.z[i] - med[i]) ** 2, 0) })).sort((x, y) => x.d - y.d).slice(0, 5).map(x => x.a.name);
  return { top, ex, n: ms.length, text: top.length ? `全国の市区町村と比べて、${quote(top.map(x => phr(x.i, med[x.i] > 0)))}地域が多い類型です。` : `多くの指標が全国の中央値に近い類型です。` };
}
function renderLegend() {
  const el = $("#legend");
  if (MODE === "sim" || !TY) {
    el.innerHTML = `<div class="hint">色が近い ＝ 指標の傾向が近い</div><div class="ramp"></div><div class="ends"><span>赤寄り：都市的</span><span>青寄り：農村的</span></div>`;
    return;
  }
  const btn = (lv, id, t) => `<button class="ty" data-ty="${lv}:${id}" aria-pressed="${!!tyFocus && tyFocus[0] === lv && tyFocus[1] === id}"><span class="dot" style="background:${t.color}"></span><span>${esc(t.name)}</span><span class="n num">${t.n}</span></button>`;
  let h = `<div class="hint">${MODE === "major" ? `${TY.major.length}の大分類` : `${TY.minor.length}の小分類（目安）`} · クリックでその類型だけを表示</div><div class="tylist">`;
  if (MODE === "major") h += TY.major.map((t, i) => btn("major", i, t)).join("");
  else TY.major.forEach((g, m) => {
    h += `<div class="gh"><span class="dot" style="background:${g.color};width:7px;height:7px"></span>${esc(g.name)}</div>`;
    h += TY.minor.map((t, i) => [t, i]).filter(([t]) => t.major === m).map(([t, i]) => btn("minor", i, t)).join("");
  });
  h += `</div>`;
  if (tyFocus) {
    const [lv, id] = tyFocus, t = TY[lv][id], d = describeType(lv, id);
    h += `<div class="tyfocus" style="border-left-color:${t.color}"><b>${esc(t.name)}</b>${lv === "minor" ? `<small style="margin:0 0 4px">${esc(TY.major[t.major].name)}</small>` : ""}<div>${esc(d.text)}</div>
      <small>中央値に近い例: ${d.ex.map(esc).join("、")}<br>分類の安定度 ${t.stability.toFixed(2)}（${t.stability >= .6 ? "安定" : t.stability >= .35 ? "やや不安定" : "不安定。境目があいまいな類型"}）</small></div>`;
  }
  const prev = el.querySelector(".tylist"), top = prev ? prev.scrollTop : 0, foc = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.ty;
  el.innerHTML = h;
  const list = el.querySelector(".tylist");
  if (list) list.scrollTop = top;
  if (foc) { const b = el.querySelector(`[data-ty="${foc}"]`); b && b.focus({ preventScroll: true }); }
  el.querySelectorAll("[data-ty]").forEach(b => b.onclick = () => {
    const [lv, id] = b.dataset.ty.split(":"), k = [lv, +id];
    tyFocus = tyFocus && tyFocus[0] === k[0] && tyFocus[1] === k[1] ? null : k;
    if (tyFocus && selected) clearSel();
    renderLegend(); applyOpacity();
  });
}
function setLabelFocus(keep) {
  const inKeep = ["in", ["get", "code"], ["literal", keep]];
  map.setFilter("labels-sel", inKeep);
  map.setFilter("labels", ["!", inKeep]);
  map.setPaintProperty("labels", "text-opacity", keep.length ? .55 : ["interpolate", ["linear"], ["zoom"], LABEL_MINZOOM, 0, LABEL_MINZOOM + .4, 1]);
}
function clearSel() {
  if (!selected) return;
  setStates(selected, false); setCmpState(cmp, false);
  selected = cmp = null;
  applyOpacity();
  setLabelFocus([]);
  map.getSource("links").setData({ type: "FeatureCollection", features: [] });
  markers.forEach(m => m.remove()); markers = [];
  history.replaceState(null, "", location.pathname + location.search);
  document.title = "市区町村 統計類似色マップ";
  renderEmpty(); setSheet("peek");
}
function initPad() {
  const narrow = innerWidth <= 760;
  return narrow ? { top: 130, bottom: 90, left: 10, right: 10 } : { top: 30, bottom: 100, left: 300, right: 60 };
}
function pad() {
  const sh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sheet-h")) || $("#sheet").getBoundingClientRect().height, narrow = innerWidth <= 760;
  const p = { top: narrow ? 120 : 80, bottom: Math.min(sh + 30, innerHeight * .6), left: narrow ? 30 : 380, right: narrow ? 30 : 80 };
  const fit = (a, b, n) => { const k = Math.min(1, Math.max(0, n - 60) / (p[a] + p[b])); p[a] *= k; p[b] *= k; };
  fit("top", "bottom", innerHeight); fit("left", "right", innerWidth);
  return p;
}
function drawMarkers(a) {
  markers.forEach(m => m.remove()); markers = [];
  const mk = (code, cls, txt) => {
    const el = document.createElement("div"); el.className = "mk " + cls; el.textContent = txt; el.dataset.code = code;
    el.title = label(byCode[code]);
    el.onclick = ev => { ev.stopPropagation(); code === selected ? null : setCmp(code, true); };
    el.ondblclick = ev => { ev.stopPropagation(); select(code); };
    markers.push(new maplibregl.Marker({ element: el }).setLngLat(CENT[code]).addTo(map));
  };
  (a.neighbors || []).slice().reverse().forEach((n, i, arr) => CENT[n.code] && mk(n.code, n.code === cmp ? "on" : "", arr.length - i));
  if (CENT[a.code]) mk(a.code, "self", "");
}

/* ---- シート ---- */
function setSheet(s) {
  const el = $("#sheet");
  el.dataset.state = s;
  const narrow = innerWidth <= 760;
  const h = s === "peek" ? 64 : s === "half" ? Math.round(innerHeight * (narrow ? .55 : .46)) : Math.round(innerHeight - (narrow ? 120 : 96));
  document.documentElement.style.setProperty("--sheet-h", h + "px");
  if (s === "full" && !$("#about").classList.contains("min")) $("#aboutToggle").click();
}
$("#grab").onclick = e => {
  if (e.target.closest("[data-clear]")) return clearSel();
  if (e.target.closest(".examples")) return;
  const s = $("#sheet").dataset.state;
  setSheet(s === "peek" ? "half" : s === "half" ? "full" : "peek");
};
$("#grab").onkeydown = e => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("#grab").click(); } };
addEventListener("resize", () => setSheet($("#sheet").dataset.state));

function renderEmpty() {
  $("#ttl").innerHTML = `<div style="min-width:0"><div class="eyebrow">Select an area</div><div class="sub" style="color:var(--tx);font-size:13px">地図をクリックするか、検索窓から市区町村を選んでください</div></div>`;
  $("#left").innerHTML = `<div class="sec-h"><h3>試してみる</h3></div><div class="examples">${EXAMPLES.map(n => {
    const a = A.areas.find(x => x.name === n); return a ? `<button data-go="${a.code}"><span class="dot" style="background:${color(a)};display:inline-block;vertical-align:-1px;margin-right:6px"></span>${esc(n)}</button>` : "";
  }).join("")}</div>
  <p class="note" style="margin-top:16px">地域を選ぶと、統計的に似ている市区町村 Top${A.meta.k} と、どの指標が似ていてどこが違うのかを表示します。</p>`;
  $("#right").innerHTML = `<div class="sec-h"><h3>このマップの読み方</h3></div>
  <div class="li"><span>色が近い</span><span class="r">${IND.length}指標の傾向が近い（色そのものは評価や順位ではありません）</span></div>
  <div class="li"><span>赤寄り／青寄り</span><span class="r">都市的／農村的な傾向の目安（詳しくは「手法」）</span></div>
  <div class="li"><span>大分類／小分類</span><span class="r">左上で類型ごとの色分けに切り替え。凡例をクリックするとその類型だけを表示</span></div>

  $("#sheet").querySelectorAll("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go));
}

function stabInfo(code) {
  const st = SENS && SENS.stability[code];
  if (st == null) return null;
  const lv = st >= .8 ? ["高", "var(--ok)"] : st >= .6 ? ["中", "var(--warn)"] : ["低", "var(--bad)"];
  return { st, lv };
}

function renderSelected() {
  const a = byCode[selected];

function traits(a) {

// 符号のある率は全国中央値が負なので、z が高くても実数は負のことがある: [実数が正, 実数が負, 比較の言い方]
const SIGNED = {
  pop_change: ["人口が増えている", "人口の減少が全国の中央値より小さい", "人口増減率が高い"],
  proj_change_2050: ["将来も人口が増えると推計されている", "将来の人口減少が全国の中央値より小さいと推計されている", "将来推計の人口変化率が高い"],
  natural_change: ["出生が死亡を上回っている", "死亡超過が全国の中央値より小さい", "自然増減率が高い"],
  net_migration: ["転入が転出を上回っている", "転出超過が全国の中央値より小さい", "社会増減率（転入−転出）が高い"],
};
function phr(i, up, ...areas) {
  const k = IND[i].key, sg = SIGNED[k];
  if (up && sg) return areas.length ? (areas.every(o => o.raw[i] > 0) ? sg[0] : sg[1]) : sg[2];
  return (PHRASE[k] || [shortLabel(IND[i].label) + "が高い", shortLabel(IND[i].label) + "が低い"])[up ? 0 : 1];
}
const quote = xs => xs.map(t => `「${t}」`).join("");
const isImp = (o, i) => !!(o.imputed && o.imputed.includes(IND[i].key));
const IMP_NOTE = `（挙げた指標の一部は、統計が欠けているため、ほかの指標が似た市区町村の値から推定しています）`;
const proseNote = () => `${IND.length}指標の数値を決まった文型で言い換えた要約です。似ている理由（因果関係）を示すものではありません。`;

// 全国中央値からの偏差が大きい指標を、同じ分野から2つまでに絞って選ぶ
function salient(a, n = 3, min = 1) {
  const per = {};
  return IND.map((d, i) => ({ i, s: Math.abs(a.z[i]) })).filter(x => x.s >= min).sort((x, y) => y.s - x.s)
    .filter(x => (per[IND[x.i].group] = (per[IND[x.i].group] || 0) + 1) <= 2).slice(0, n);
}

function describeArea(a) {
  const top = salient(a);
  const s = stabInfo(a.code);
  const ty = tyOf(a);
  let t = ty ? `${esc(a.name)}は、大分類「${esc(majorOf(a).name)}」のうち、小分類「${esc(minorOf(a).name)}」に分類される地域です。` : "";
  if (ty && ty[3] < .2) t += `ただし、小分類の境目に近く、計算の条件によっては別の小分類に入ります。`;
  t += top.length ? `全国の市区町村と比べると、${esc(quote(top.map(x => phr(x.i, a.z[x.i] > 0, a))))}点が目立ちます。`
    : `多くの指標が全国の中央値に近い地域です。`;
  if (top.some(x => isImp(a, x.i))) t += IMP_NOTE;
  if (s) t += s.lv[0] === "高" ? `似ている市区町村 Top${A.meta.k} は、条件を変えて計算し直してもほとんど入れ替わりません。`
    : s.lv[0] === "中" ? `似ている市区町村 Top${A.meta.k} は、条件を変えて計算し直すと一部が入れ替わります。`
    : `似ている市区町村 Top${A.meta.k} は、条件を変えて計算し直すとかなり入れ替わるため、目安としてご覧ください。`;
  return t;
}

function describePair(a, b, c, d2, byG, common, diff) {
  const A_ = esc(a.name), B_ = esc(b.name);
  const rank = a.neighbors.findIndex(n => n.code === b.code) + 1;
  const cm = common.slice(0, 3);
  const cites = [];
  const ta = tyOf(a), tb = tyOf(b);
  let t = !ta || !tb ? "" : ta[1] === tb[1] ? `${A_}と${B_}は、どちらも「${esc(minorOf(a).name)}」に分類されます。`
    : ta[0] === tb[0] ? `${A_}と${B_}は、どちらも大分類「${esc(majorOf(a).name)}」に入ります。小分類は、${A_}が「${esc(minorOf(a).name)}」、${B_}が「${esc(minorOf(b).name)}」です。`
    : `${A_}は「${esc(majorOf(a).name)}」、${B_}は「${esc(majorOf(b).name)}」と大分類は異なりますが、${A_}に似ている市区町村の${rank}位です。`;
  if (cm.length) { t += `特に、どちらも${esc(quote(cm.map(x => phr(x.i, a.z[x.i] > 0, a, b))))}点が共通しています。`; cites.push(...cm.map(x => x.i)); }
  else t += `どちらも多くの指標が全国の中央値に近いことが、似ている主な理由です。`;
  const kMax = byG.indexOf(Math.max(...byG)), kMin = byG.indexOf(Math.min(...byG));
  t += `${IND.length}指標の差のうち、いちばん大きいのは「${esc(GROUPS[kMax])}」の分野（${pct(byG[kMax])}）で、いちばん小さいのは「${esc(GROUPS[kMin])}」の分野（${pct(byG[kMin])}）です。`;
  const parts = [];
  for (const o of [a, b]) {
    const xs = diff.slice(0, 3).filter(x => x.s / d2 >= .05 && (a.z[x.i] > b.z[x.i]) === (o === a));
    if (xs.length) { parts.push(`${esc(o.name)}のほうが${esc(quote(xs.map(x => phr(x.i, true))))}`); cites.push(...xs.map(x => x.i)); }
  }
  if (parts.length) t += `個別の指標では、${parts.join("、")}という違いがあります。`;
  if (cites.some(i => isImp(a, i) || isImp(b, i))) t += IMP_NOTE;
  return t;
}

function prose(text, col) {
  return `<div class="prose" style="border-left-color:${col}"><p>${text}</p><p class="pn">${proseNote()}</p></div>`;
}

function renderLeft(a) {
  const t = traits(a);
  let h = `<p class="lead">${describeArea(a)}</p><div class="sec-h"><h3>似ている市区町村 Top${A.meta.k}</h3><small>クリックで比較 · ⤴で移動</small></div><div class="cards">`;
  a.neighbors.forEach((n, i) => {
    const b = byCode[n.code];
    const dist = CENT[a.code] && CENT[n.code] ? km(CENT[a.code], CENT[n.code]) : null;
    const w = Math.max(.04, 1 - n.d / D_REF);
    h += `<div class="card${n.code === cmp ? " on" : ""}" data-code="${n.code}" role="button" tabindex="0" aria-label="${i + 1}位 ${esc(label(b))}">

  h += `</div>` + (t ? `<div class="sec-h" style="margin-top:18px"><h3>この地域の特徴</h3><small>全国中央値との差が大きい指標</small></div><div class="traits">${t}</div>` : "");

  $("#left").innerHTML = h;
}

function setCmp(code, scroll) {
  if (!selected || code === cmp) return;

  renderRight(byCode[selected]);
}
$("#left").addEventListener("click", e => {
  const go = e.target.closest("[data-go]");

});
$("#left").addEventListener("dblclick", e => { const c = e.target.closest(".card"); if (c) select(c.dataset.code); });
$("#left").addEventListener("keydown", e => { const c = e.target.closest(".card"); if (c && e.key === "Enter") setCmp(c.dataset.code); });

function renderRight(a) {
  const b = cmp ? byCode[cmp] : null;
  if (!b) { $("#right").innerHTML = profileTable(a, null); return; }
  const c = IND.map((d, i) => W[i] * (a.z[i] - b.z[i]) ** 2);
  const d2 = c.reduce((s, v) => s + v, 0) || 1;
  const byG = GROUPS.map(g => IND.reduce((s, d, i) => s + (d.group === g ? c[i] : 0), 0) / d2);
  const gmax = Math.max(...byG);
  const common = IND.map((d, i) => ({ i, s: Math.sign(a.z[i]) === Math.sign(b.z[i]) ? Math.min(Math.abs(a.z[i]), Math.abs(b.z[i])) : 0 }))
    .filter(x => x.s >= .5).sort((x, y) => y.s - x.s).slice(0, 5);
  const diff = IND.map((d, i) => ({ i, s: c[i] })).sort((x, y) => y.s - x.s).slice(0, 5);
  let h = `<div class="vs"><span class="who"><span class="sw" style="background:${color(a)}"></span>${esc(a.name)}</span><span class="x">×</span>
    <span class="who"><span class="sw" style="background:${color(b)}"></span>${esc(b.name)}</span>
    <span class="chip num" style="margin-left:auto">${a.neighbors.findIndex(n => n.code === b.code) + 1}位 · 距離 ${a.neighbors.find(n => n.code === b.code).d.toFixed(2)}</span></div>
  ${prose(describePair(a, b, c, d2, byG, common, diff), color(b))}
  <div class="cmpgrid">
    <div class="box"><h4>共通の特徴<span class="badge c">どちらも全国中央値から同じ向きに離れている</span></h4>

    </div>
    <div class="box"><h4>主な違い<span class="badge d">距離への寄与が大きい指標</span></h4>
      ${diff.map(x => `<div class="li"><span>${esc(shortLabel(IND[x.i].label))}</span><span class="r num">${fmt(a.raw[x.i])} / ${fmt(b.raw[x.i])}　<b style="color:var(--warn)">${pct(c[x.i] / d2)}</b></span></div>`).join("")}

      ${GROUPS.map((g, k) => `<div class="dom"><span>${esc(g)}</span><span class="tr"><i style="width:${byG[k] / gmax * 100}%;background:${GROUP_COLORS[k % 7]}"></i></span><span class="v num">${pct(byG[k])}</span></div>`).join("")}
    </div>

function profileTable(a, b) {
  const ca = "#ffffff", cb = b ? color(b) : null;
  let h = `<div class="sec-h"><h3>指標プロファイル</h3><small>全国中央値からの標準化偏差（±4）</small></div>
    <div class="legendrow"><span><span class="dot" style="background:${ca}"></span>${esc(a.name)}</span>${b ? `<span><span class="dot" style="background:${cb}"></span>${esc(b.name)}</span>` : ""}<span>｜ 中央の線＝全国中央値 · 右の数値は実際の値${b ? "（左／右）" : ""} · *は近傍補完</span></div><table class="prof">`;
  let g = null;
  const x = z => 50 + Math.max(-4, Math.min(4, z)) / 4 * 48;
  IND.forEach((ind, i) => {
    if (ind.group !== g) { g = ind.group; h += `<tr class="g"><td colspan="3">${esc(g)}</td></tr>`; }
    const za = a.z ? a.z[i] : null, zb = b ? b.z[i] : null;
    const imp = (o, k) => o && o.imputed && o.imputed.includes(k) ? "*" : "";
    let bar = `<div class="db"><div class="ax"></div><div class="c0"></div>`;
    if (za != null && zb != null) bar += `<div class="seg" style="left:${Math.min(x(za), x(zb))}%;width:${Math.abs(x(za) - x(zb))}%"></div>`;
    if (zb != null) bar += `<div class="p" style="left:${x(zb)}%;background:${cb}"></div>`;
    if (za != null) bar += `<div class="p" style="left:${x(za)}%;background:${ca}"></div>`;
    bar += `</div>`;
    h += `<tr><td class="lb">${esc(ind.label)}</td><td>${bar}</td><td class="vals num">${fmt(a.raw[i])}${imp(a, ind.key)}${b ? ` / ${fmt(b.raw[i])}${imp(b, ind.key)}` : ""}</td></tr>`;
  });
  return h + `</table>`;
}

/* ---- 検索 ---- */
const q = $("#q"), sugg = $("#sugg");
let hits = [], hi = 0;
const norm = s => s.normalize("NFKC").replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s/g, "");
function search(v) {
  const t = norm(v);
  if (!t) return [];
  const sc = a => { const n = norm(a.name), l = norm(a.pref + a.name); return n.startsWith(t) ? 0 : n.includes(t) ? 1 : l.includes(t) ? 2 : 9; };
  return A.areas.map(a => [sc(a), a]).filter(x => x[0] < 9).sort((x, y) => x[0] - y[0] || x[1].name.length - y[1].name.length).slice(0, 8).map(x => x[1]);
}
function renderSugg() {
  const open = q.value.trim() !== "";
  sugg.classList.toggle("open", open); q.setAttribute("aria-expanded", open);
  if (!open) return;
  sugg.innerHTML = hits.length ? hits.map((a, i) => `<button role="option" tabindex="-1" aria-selected="${i === hi}" data-code="${a.code}"><span class="dot" style="background:${color(a)}"></span>${esc(a.name)}<span class="pref">${esc(a.pref)}</span></button>`).join("")
    : `<div class="empty">該当する市区町村がありません</div>`;
}
q.addEventListener("input", () => { hits = search(q.value); hi = 0; renderSugg(); });
q.addEventListener("keydown", e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (hits.length) { hi = (hi + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length; renderSugg(); } }
  else if (e.key === "Enter") { if (hits[hi]) pick(hits[hi].code); }
  else if (e.key === "Escape") { e.stopPropagation(); q.value = ""; hits = []; renderSugg(); q.blur(); }
});
q.addEventListener("focus", () => { $("#kbd").style.display = "none"; if (q.value) renderSugg(); });
q.addEventListener("blur", () => { $("#kbd").style.display = ""; setTimeout(() => sugg.classList.remove("open"), 150); });
sugg.addEventListener("mousedown", e => { const b = e.target.closest("[data-code]"); if (b) { e.preventDefault(); pick(b.dataset.code); } });
function pick(code) { q.value = ""; hits = []; renderSugg(); q.blur(); select(code); }
addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q && !$("#dlg").open) { e.preventDefault(); q.focus(); }
  else if (e.key === "Escape" && !$("#dlg").open && document.activeElement !== q && selected) clearSel();
});
addEventListener("hashchange", () => { const h = decodeURIComponent(location.hash.slice(1)); if (byCode[h] && h !== selected) select(h, { push: false }); });

if (innerWidth <= 760) { $("#about").classList.add("min"); $("#aboutToggle").style.transform = "rotate(180deg)"; }

new ResizeObserver(layoutSearch).observe($("#about")); addEventListener("resize", layoutSearch);

}
document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openDlg(b.dataset.open));

dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
